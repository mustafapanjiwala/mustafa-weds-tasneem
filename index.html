<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mustafa &amp; Dr. Tasneem — Wedding Invitation</title>
<meta name="description" content="You are warmly invited to the wedding celebrations of Mustafa &amp; Dr. Tasneem, 6 to 11 January 2027, Ujjain.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mustafapanjiwala.github.io/mustafa-weds-tasneem/">
<meta property="og:title" content="Mustafa &amp; Dr. Tasneem — Wedding Invitation">
<meta property="og:description" content="You are warmly invited to our wedding celebrations, 6 to 11 January 2027, Ujjain.">
<meta property="og:image" content="https://mustafapanjiwala.github.io/mustafa-weds-tasneem/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mustafapanjiwala.github.io/mustafa-weds-tasneem/preview.jpg">
<meta name="theme-color" content="#5c1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="lily" viewBox="0 0 220 420">
    <path d="M120 412 C118 330 135 260 128 170"/>
    <path d="M128 172 C92 150 78 96 104 40 C112 24 126 14 140 8 C136 30 150 44 166 62 C186 86 176 140 128 172 Z"/>
    <path d="M128 172 C118 130 124 70 140 8"/><path d="M104 40 C122 58 142 64 166 62"/>
    <path d="M135 142 C140 114 141 92 137 72"/>
    <path d="M122 362 C104 312 84 280 62 238"/>
    <path d="M62 238 C36 232 16 196 24 152 C28 138 36 128 46 120 C48 138 60 148 74 160 C92 178 92 216 62 238 Z"/>
    <path d="M62 238 C50 204 44 160 46 120"/><path d="M24 152 C40 160 58 162 74 160"/>
    <path d="M63 216 C61 196 59 180 55 166"/>
    <path d="M124 330 C160 318 196 280 204 226 C170 240 134 276 124 330 Z"/><path d="M124 330 C150 296 180 258 204 226"/>
    <path d="M120 394 C84 390 50 362 36 320 C72 324 106 352 120 394 Z"/><path d="M120 394 C92 368 62 340 36 320"/>
    <path d="M127 250 C150 236 164 214 166 190 C148 200 132 222 127 250 Z"/>
  </symbol>
  <symbol id="sprig" viewBox="0 0 120 26">
    <path d="M4 13 H44 M76 13 H116"/><path d="M60 3 C54 9 54 17 60 23 C66 17 66 9 60 3 Z"/>
    <path d="M48 13 C52 8 57 8 60 13 C57 18 52 18 48 13 Z M72 13 C68 8 63 8 60 13 C63 18 68 18 72 13 Z"/>
  </symbol>
</svg>
<svg class="flora side-flora l flip" aria-hidden="true"><use href="#lily"/></svg><svg class="flora side-flora r" aria-hidden="true"><use href="#lily"/></svg>

<!-- ============ COVER (two doors that open) ============ -->
<div class="topbar">
  <button id="musicBtn" class="music" type="button" aria-label="Music on/off" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="slash" d="M3 3l18 18"/></svg>
  </button>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ar">ع</button></div>
</div>
<audio id="bgm" loop preload="none"></audio>

<div id="cover" aria-label="Invitation cover">
  <div class="door door-l"></div>
  <div class="door door-r"></div>
  <svg class="flora l flip" aria-hidden="true"><use href="#lily"/></svg><svg class="flora r" aria-hidden="true"><use href="#lily"/></svg><svg class="flora t" aria-hidden="true"><use href="#lily"/></svg><svg class="flora t2" aria-hidden="true"><use href="#lily"/></svg>
  <div class="cover-inner">
    <p class="eyebrow" data-t="weddingOf"></p>
    <div class="monogram" data-monogram></div>
    <h1 class="script cover-names"><span data-groom></span><em>&amp;</em><span data-bride></span></h1>
    <p class="cover-date" data-maindate></p>
    <button id="openBtn" type="button" data-t="open"></button>
    <p class="cover-sub" data-coverline></p>
  </div>
</div>

<main id="invite">

  <!-- ============ NAMES SCREEN ============ -->
  <section class="intro"><svg class="flora a" aria-hidden="true"><use href="#lily"/></svg><svg class="flora b flip" aria-hidden="true"><use href="#lily"/></svg><svg class="flora c" aria-hidden="true"><use href="#lily"/></svg><svg class="flora d flip" aria-hidden="true"><use href="#lily"/></svg>
    <p class="eyebrow" data-t="weddingOf"></p>
    <svg class="sprig-div" aria-hidden="true"><use href="#sprig"/></svg>
    <h2 class="script intro-names"><span data-groom></span><em>&amp;</em><span data-bride></span></h2>
    <svg class="sprig-div" aria-hidden="true"><use href="#sprig"/></svg>
    <p class="cover-date" data-maindate></p>
    <p class="city" data-city></p>
    <p class="scroll-hint"><span data-t="scroll"></span><br><b>&#8964;</b></p>
  </section>

  <!-- ============ INVITATION CARD (rises on scroll) ============ -->
  <section class="hero">
    <div class="arch" id="riseCard">
      <div class="monogram small" data-monogram></div>
      <p class="bismillah" lang="ar" dir="rtl">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
      <p class="blessing" data-blessing></p>
      <div class="divider"><span></span><i>&#10022;</i><span></span></div>
      <p class="hosts" data-host></p>
      <p class="hosts-sub" data-hostsub></p>
      <p class="invite-line" data-inviteline></p>
      <h2 class="script big-name" data-groom></h2>
      <p class="parents" data-groom-parents></p>
      <p class="with script" data-t="weds"></p>
      <h2 class="script big-name" data-bride></h2>
      <p class="parents" data-bride-parents></p>
      <p class="nikah" data-nikah></p>
    </div>
  </section>

  <!-- ============ COUNTDOWN ============ -->
  <section class="countdown reveal" id="countdown"><svg class="flora a" aria-hidden="true"><use href="#lily"/></svg><svg class="flora b" aria-hidden="true"><use href="#lily"/></svg>
    <p class="eyebrow" data-t="counting"></p>
    <svg class="sprig-div" aria-hidden="true"><use href="#sprig"/></svg>
    <h3 class="section-title" data-t="toWalima"></h3>
    <div class="timer">
      <div><b id="cd-d">00</b><span data-t="days"></span></div>
      <div><b id="cd-h">00</b><span data-t="hours"></span></div>
      <div><b id="cd-m">00</b><span data-t="minutes"></span></div>
      <div><b id="cd-s">00</b><span data-t="seconds"></span></div>
    </div>
  </section>

  <!-- ============ FUNCTIONS ============ -->
  <section class="functions" id="functions"><svg class="flora a" aria-hidden="true"><use href="#lily"/></svg><svg class="flora b" aria-hidden="true"><use href="#lily"/></svg>
    <p class="eyebrow reveal" data-t="celebrations"></p>
    <svg class="sprig-div" aria-hidden="true"><use href="#sprig"/></svg>
    <h3 class="section-title reveal" data-t="joinUs"></h3>
    <div id="days"></div>
  </section>

  <!-- ============ RSVP ============ -->
  <section class="rsvp reveal" id="rsvp" hidden><svg class="flora a flip" aria-hidden="true"><use href="#lily"/></svg><svg class="flora b" aria-hidden="true"><use href="#lily"/></svg>
    <p class="eyebrow" data-t="rsvp"></p>
    <svg class="sprig-div" aria-hidden="true"><use href="#sprig"/></svg>
    <h3 class="section-title" data-t="willYou"></h3>
    <p class="rsvp-text" data-rsvp-text></p>
    <a id="rsvpBtn" class="btn btn-solid" target="_blank" rel="noopener" data-t="confirm"></a>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="reveal"><svg class="flora a flip" aria-hidden="true"><use href="#lily"/></svg><svg class="flora b" aria-hidden="true"><use href="#lily"/></svg>
    <div class="monogram small" data-monogram></div>
    <p class="eyebrow" data-t="awaiting"></p>
    <div class="awaiting" data-awaiting></div>
    <p class="script foot-names"><span data-groom></span> <span data-t="amp"></span> <span data-bride></span></p>
    <p class="cover-date" data-maindate></p>
  </footer>
</main>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
